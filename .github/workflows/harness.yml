name: Verificar arnes
on: [push, pull_request]
permissions:
  contents: read
jobs:
  harness:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar estructura y estado
        run: python scripts/check_harness.py
      - name: Probar puertas de estado y entregas
        run: python -m unittest discover -s tests -v
      - name: Validar formato de diff
        run: git -c core.whitespace=blank-at-eol,blank-at-eof diff --check HEAD
